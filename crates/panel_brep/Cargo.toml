[package]
name = "panel_brep"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
i_overlay = "9.1.0"
i_shape = "5.0.0"
earcutr = "0.5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
