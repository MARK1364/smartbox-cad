<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio 3D — Kreator Akcesoriów i Bloków</title>
    <meta name="description" content="Dedykowana aplikacja 3D do tworzenia i edycji modeli, akcesoriów i bloków meblowych (nawierty cylindryczne, kieszenie, relacje parametryczne).">

    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #212121;
            color: #f1f5f9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #studio-root {
            width: 100%;
            height: 100%;
        }
        /* Shell jak CNC: scena full-bleed + pływające drzewo / panel edycji z style.css */
        body.smartparts-studio-page #pasek-menu.pasek-menu {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        body.smartparts-studio-page #panel-edycji .panel-inner-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body.smartparts-studio-page #panel-edycji .tab-content.active {
            flex: 1;
            min-height: 0;
        }
        body.smartparts-studio-page .cad-feedback-toast {
            position: fixed;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #e2e8f0;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        body.smartparts-studio-page .cad-input-title {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 5px;
            padding: 5px 10px;
            color: #f8fafc;
            font-size: 12px;
            font-weight: 600;
            outline: none;
        }
        body.smartparts-studio-page .cad-add-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.04);
            color: #e2e8f0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        body.smartparts-studio-page .cad-add-btn.is-hole {
            border-color: rgba(56, 189, 248, 0.35);
            color: #38bdf8;
        }
        body.smartparts-studio-page .cad-add-btn.is-pocket {
            border-color: rgba(245, 158, 11, 0.35);
            color: #f59e0b;
        }
        body.smartparts-studio-page .cad-prop-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        body.smartparts-studio-page .cad-prop-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            align-items: center;
        }
        body.smartparts-studio-page .cad-prop-label {
            font-size: 11px;
            color: #94a3b8;
        }
        body.smartparts-studio-page .cad-prop-input,
        body.smartparts-studio-page .cad-prop-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 12px;
            width: 100%;
        }
        body.smartparts-studio-page .cad-tree-badge {
            margin-left: auto;
            font-size: 10px;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: #94a3b8;
            flex-shrink: 0;
        }
        body.smartparts-studio-page .cad-tree-badge.is-hole { color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
        body.smartparts-studio-page .cad-tree-badge.is-pocket { color: #f59e0b; background: rgba(245, 158, 11, 0.15); }
        body.smartparts-studio-page .cad-tree-badge.is-part { color: #c084fc; background: rgba(168, 85, 247, 0.15); }
        body.smartparts-studio-page .cad-protrusion-box {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            background: rgba(14, 165, 233, 0.08);
        }
        body.smartparts-studio-page .cad-protrusion-title {
            font-size: 11px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        body.smartparts-studio-page .cad-protrusion-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        body.smartparts-studio-page .cad-protrusion-item {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 11px;
        }
        body.smartparts-studio-page .cad-protrusion-label { color: #94a3b8; }
        body.smartparts-studio-page .cad-protrusion-val { color: #e2e8f0; font-weight: 600; }
        body.smartparts-studio-page .cad-package-card {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            min-width: 140px;
            flex: 1 1 140px;
        }
        body.smartparts-studio-page .cad-package-card.is-active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.12);
        }
        body.smartparts-studio-page .cad-package-thumb {
            width: 36px;
            height: 28px;
            border-radius: 4px;
            overflow: hidden;
            background: #0f172a;
            flex-shrink: 0;
        }
        body.smartparts-studio-page .cad-package-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        body.smartparts-studio-page .cad-package-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #64748b;
        }
        body.smartparts-studio-page .cad-package-name {
            font-size: 11px;
            font-weight: 600;
            color: #e2e8f0;
        }
        body.smartparts-studio-page .cad-package-stats {
            font-size: 10px;
            color: #64748b;
        }
        body.smartparts-studio-page .cad-btn-danger-sm {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        body.smartparts-studio-page .cad-card-delete-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            cursor: pointer;
            margin-left: auto;
        }
    </style>

  <script type="module" crossorigin src="./assets/cad-translate-gizmo-DXc-rE1L.js"></script>
  <script type="module" crossorigin src="./assets/studio-entry-Bp_-SBve.js"></script>

</head>

</body>
</html>
