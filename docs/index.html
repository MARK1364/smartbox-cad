    <script>
        function isExtensionError(msg, src, stack) {
            var s = String(msg || '') + ' ' + String(src || '') + ' ' + String(stack || '');
            return /chrome-extension|moz-extension|safari-extension|content\.js|globals-front|adblock|Could not establish connection/i.test(s);
        }
        window.addEventListener("error", function(e) {
            if (isExtensionError(e.message, e.filename, e.error && e.error.stack)) {
                return;
            }
            console.error("[SmartPanel CAD Error]:", e.error || e.message);
        });
        window.addEventListener("unhandledrejection", function(e) {
            var reasonStr = e.reason ? (e.reason.message || String(e.reason)) : '';
            var stackStr = e.reason && e.reason.stack ? e.reason.stack : '';
            if (isExtensionError(reasonStr, '', stackStr)) {
                return;
            }
            console.error("[SmartPanel CAD Rejection]:", e.reason);
        });
    </script>
