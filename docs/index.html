    <!-- Styles -->

    <script>
        window.addEventListener("error", function(e) {
            console.error("Global Error:", e.error);
            const errDiv = document.createElement("div");
            errDiv.style.position = "fixed";
            errDiv.style.top = "10px";
            errDiv.style.left = "10px";
            errDiv.style.zIndex = "99999";
            errDiv.style.background = "red";
            errDiv.style.color = "white";
            errDiv.style.padding = "20px";
            errDiv.innerHTML = "<h3>Wystąpił krytyczny błąd JS:</h3><p>" + e.message + "</p><pre>" + (e.error && e.error.stack ? e.error.stack : '') + "</pre>";
            document.body.appendChild(errDiv);
        });
        window.addEventListener("unhandledrejection", function(e) {
            console.error("Unhandled Rejection:", e.reason);
            const errDiv = document.createElement("div");
            errDiv.style.position = "fixed";
            errDiv.style.top = "150px";
            errDiv.style.left = "10px";
            errDiv.style.zIndex = "99999";
            errDiv.style.background = "orange";
            errDiv.style.color = "black";
            errDiv.style.padding = "20px";
            errDiv.innerHTML = "<h3>Unhandled Promise Rejection:</h3><p>" + e.reason + "</p>";
            document.body.appendChild(errDiv);
        });
    </script>
