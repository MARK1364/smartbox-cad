[package]
name = "wasm-dividers"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[profile.release]
opt-level = "z"     # Optymalizacja pod rozmiar binarnego WASM
lto = true
codegen-units = 1
panic = "abort"

